# ROS 2 Humble parameters. Extrinsics map LiDAR coordinates into the IMU frame.
/**:
  ros__parameters:
    common:
      lid_topic: /velodyne_points
      imu_topic: /alphasense/imu
      time_sync_en: false
    preprocess:
      lidar_type: 2
      scan_line: 32
      scan_rate: 10
      blind: 0.7
      point_filter_num: 1
    mapping:
      down_sample_size: 0.2
      max_iteration: 4
      voxel_size: 0.25
      max_layer: 2
      layer_point_size:
      - 5
      - 5
      - 5
      - 5
      - 5
      plannar_threshold: 0.01
      max_points_size: 1000
      max_cov_points_size: 1000
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_en: false
      extrinsic_T:
      - -0.001
      - -0.00855
      - 0.055
      extrinsic_R:
      - 1.11022302e-16
      - -1.0
      - 0.0
      - -1.0
      - 1.11022302e-16
      - -0.0
      - 0.0
      - 0.0
      - -1.0
    noise_model:
      ranging_cov: 0.01
      angle_cov: 0.1
      acc_cov: 0.5
      gyr_cov: 0.25
      b_acc_cov: 0.0043
      b_gyr_cov: 0.000266
    publish:
      pub_voxel_map: false
      publish_max_voxel_layer: 2
      path_en: true
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true
    pcd_save:
      pcd_save_en: false
      interval: -1
